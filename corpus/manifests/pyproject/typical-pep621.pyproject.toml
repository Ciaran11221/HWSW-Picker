[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "example-service"
version = "1.0.6"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.50.0",
    "Django[argon2]>=4.2,<5; python_version >= '3.9'",
    "numpy~=1.21",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
gpu = ["flash-attn>=2.5.0"]

[project.urls]
Repository = "https://example.invalid/team/example-service"
