// dependencies { implementation 'commented:out:1.0' }
/* implementation 'block:commented:1.0' */
buildscript {
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.0'
    }
}

dependencies {
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.14'
    implementation group: 'org.yaml', name: 'snakeyaml'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0', 'org.slf4j:slf4j-api:2.0.13'
    implementation "com.fasterxml.jackson.core:jackson-core:$jacksonVersion"
    implementation 'androidx.appcompat:appcompat:1.6.1@aar'
    implementation 'io.netty:netty-transport-native-epoll:4.1.100.Final:linux-x86_64'
    implementation('org.hibernate:hibernate-core:6.5.2.Final') {
        exclude group: 'org.jboss.logging', module: 'jboss-logging'
    }
    implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:3.3.1')
    implementation files('libs/local.jar')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':shared')
    implementation libs.kotlin.stdlib
    testImplementation 'org.mockito:mockito-core:5.+'
    implementation 'org.slf4j:slf4j-api:1.7.36'
}
